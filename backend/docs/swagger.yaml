basePath: /api/v1
definitions:
  service.CommentInfo:
    properties:
      author:
        $ref: '#/definitions/service.UserProfile'
      comment_id:
        type: integer
      content:
        type: string
      created_at:
        type: string
      post_id:
        type: integer
      updated_at:
        type: string
    type: object
  service.PostInfo:
    properties:
      author:
        $ref: '#/definitions/service.UserProfile'
      comments:
        items:
          $ref: '#/definitions/service.CommentInfo'
        type: array
      content:
        type: string
      created_at:
        type: string
      post_id:
        type: integer
      title:
        type: string
      topic_id:
        type: integer
      updated_at:
        type: string
    type: object
  service.TopicInfo:
    properties:
      author:
        $ref: '#/definitions/service.UserProfile'
      created_at:
        type: string
      description:
        type: string
      name:
        type: string
      posts:
        items:
          $ref: '#/definitions/service.PostInfo'
        type: array
      topic_id:
        type: integer
      updated_at:
        type: string
    type: object
  service.UserProfile:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      created_at:
        type: string
      email:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
      username:
        type: string
    type: object
  v1.CreateCommentRequest:
    properties:
      content:
        example: This is a comment
        type: string
    required:
    - content
    type: object
  v1.CreatePostRequest:
    properties:
      content:
        example: This is the content of my post
        type: string
      title:
        example: My First Post
        type: string
    required:
    - title
    type: object
  v1.CreateTopicRequest:
    properties:
      description:
        example: A place for general conversations
        type: string
      title:
        example: General Discussion
        type: string
    required:
    - title
    type: object
  v1.ErrorResponse:
    properties:
      error:
        example: error message
        type: string
    type: object
  v1.LoginRequest:
    properties:
      password:
        example: securepassword123
        type: string
      username:
        example: johndoe
        type: string
    required:
    - password
    - username
    type: object
  v1.LoginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        example: 300
        type: integer
      refresh_token:
        type: string
      token_type:
        example: Bearer
        type: string
    type: object
  v1.RegisterRequest:
    properties:
      email:
        example: john@example.com
        type: string
      password:
        example: securepassword123
        type: string
      username:
        example: johndoe
        type: string
    required:
    - email
    - password
    - username
    type: object
  v1.UpdateCommentRequest:
    properties:
      content:
        example: Updated comment content
        type: string
    type: object
  v1.UpdatePostRequest:
    properties:
      content:
        example: Updated post content
        type: string
      title:
        example: Updated Post Title
        type: string
    type: object
  v1.UpdateTopicRequest:
    properties:
      description:
        example: Updated description
        type: string
      title:
        example: Updated Topic Title
        type: string
    type: object
  v1.UpdateUserRequest:
    properties:
      avatar_url:
        example: https://example.com/avatar.jpg
        type: string
      bio:
        example: Software developer
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API for CVWO forum assignment backend
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: CVWO Forum API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return JWT token
      parameters:
      - description: User login details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.LoginResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      summary: User login
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Invalidate user JWT token
      produces:
      - application/json
      responses:
        "200":
          description: Logout successful message
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: User logout
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Refresh user JWT token
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.LoginResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Refresh JWT token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account with username, email, and password
      parameters:
      - description: User registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/service.UserProfile'
        "409":
          description: Username or email already exists
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "422":
          description: Invalid input
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      summary: Register a new user
      tags:
      - auth
  /comments:
    get:
      consumes:
      - application/json
      description: Get a paginated list of comments, optionally filtered by post ID
        or user ID
      parameters:
      - default: 20
        description: Number of items per page
        in: query
        name: limit
        type: integer
      - default: 0
        description: Number of items to skip
        in: query
        name: offset
        type: integer
      - description: Filter by post ID
        in: query
        name: post_id
        type: integer
      - description: Filter by user ID
        in: query
        name: user_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/service.CommentInfo'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      summary: List comments
      tags:
      - comments
  /comments/{comment_id}:
    delete:
      consumes:
      - application/json
      description: Delete a comment (author only)
      parameters:
      - description: Comment ID
        in: path
        name: comment_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "403":
          description: Forbidden - not the author
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Comment not found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a comment
      tags:
      - comments
    get:
      consumes:
      - application/json
      description: Retrieve detailed information about a specific comment
      parameters:
      - description: Comment ID
        in: path
        name: comment_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.CommentInfo'
        "400":
          description: Invalid comment ID
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Comment not found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      summary: Get comment by ID
      tags:
      - comments
    patch:
      consumes:
      - application/json
      description: Update a comment's content (author only)
      parameters:
      - description: Comment ID
        in: path
        name: comment_id
        required: true
        type: integer
      - description: Comment update details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.UpdateCommentRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "403":
          description: Forbidden - not the author
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Comment not found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "422":
          description: Invalid input
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a comment
      tags:
      - comments
  /posts:
    get:
      consumes:
      - application/json
      description: Get a paginated list of posts, optionally filtered by topic ID
        or user ID
      parameters:
      - default: 20
        description: Number of items per page
        in: query
        name: limit
        type: integer
      - default: 0
        description: Number of items to skip
        in: query
        name: offset
        type: integer
      - description: Filter by topic ID
        in: query
        name: topic_id
        type: integer
      - description: Filter by user ID
        in: query
        name: user_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/service.PostInfo'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      summary: List posts
      tags:
      - posts
  /posts/{post_id}:
    delete:
      consumes:
      - application/json
      description: Delete a post (author only)
      parameters:
      - description: Post ID
        in: path
        name: post_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "403":
          description: Forbidden - not the author
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Post not found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a post
      tags:
      - posts
    get:
      consumes:
      - application/json
      description: Retrieve detailed information about a specific post
      parameters:
      - description: Post ID
        in: path
        name: post_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.PostInfo'
        "400":
          description: Invalid post ID
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Post not found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      summary: Get post by ID
      tags:
      - posts
    patch:
      consumes:
      - application/json
      description: Update a post's title or content (author only)
      parameters:
      - description: Post ID
        in: path
        name: post_id
        required: true
        type: integer
      - description: Post update details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.UpdatePostRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "403":
          description: Forbidden - not the author
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Post not found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "422":
          description: Invalid input
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a post
      tags:
      - posts
  /posts/{post_id}/comments:
    post:
      consumes:
      - application/json
      description: Create a new comment on a specific post
      parameters:
      - description: Post ID
        in: path
        name: post_id
        required: true
        type: integer
      - description: Comment creation details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.CreateCommentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/service.CommentInfo'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Post not found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a new comment
      tags:
      - comments
  /topics:
    get:
      consumes:
      - application/json
      description: Get a paginated list of topics, optionally filtered by user ID
      parameters:
      - default: 20
        description: Number of items per page
        in: query
        name: limit
        type: integer
      - default: 0
        description: Number of items to skip
        in: query
        name: offset
        type: integer
      - description: Filter by user ID
        in: query
        name: user_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/service.TopicInfo'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      summary: List topics
      tags:
      - topics
    post:
      consumes:
      - application/json
      description: Create a new discussion topic
      parameters:
      - description: Topic creation details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.CreateTopicRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/service.TopicInfo'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "409":
          description: Topic title already exists
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a new topic
      tags:
      - topics
  /topics/{topic_id}:
    delete:
      consumes:
      - application/json
      description: Delete a topic (author only)
      parameters:
      - description: Topic ID
        in: path
        name: topic_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "403":
          description: Forbidden - not the author
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Topic not found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a topic
      tags:
      - topics
    get:
      consumes:
      - application/json
      description: Retrieve detailed information about a specific topic
      parameters:
      - description: Topic ID
        in: path
        name: topic_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.TopicInfo'
        "400":
          description: Invalid topic ID
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Topic not found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      summary: Get topic by ID
      tags:
      - topics
    patch:
      consumes:
      - application/json
      description: Update a topic's title or description (author only)
      parameters:
      - description: Topic ID
        in: path
        name: topic_id
        required: true
        type: integer
      - description: Topic update details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.UpdateTopicRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "403":
          description: Forbidden - not the author
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Topic not found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "422":
          description: Invalid input
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a topic
      tags:
      - topics
  /topics/{topic_id}/posts:
    post:
      consumes:
      - application/json
      description: Create a new post in a specific topic
      parameters:
      - description: Topic ID
        in: path
        name: topic_id
        required: true
        type: integer
      - description: Post creation details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.CreatePostRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/service.PostInfo'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Topic not found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a new post
      tags:
      - posts
  /users/{user_id}:
    get:
      consumes:
      - application/json
      description: Retrieve public profile information for a specific user
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.UserProfile'
        "400":
          description: Invalid user ID
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      summary: Get user profile by ID
      tags:
      - users
  /users/me:
    get:
      consumes:
      - application/json
      description: Retrieve the authenticated user's profile information
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.UserProfile'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - users
    patch:
      consumes:
      - application/json
      description: Update the authenticated user's avatar URL or bio
      parameters:
      - description: Profile update details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "422":
          description: Invalid input
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update current user profile
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
